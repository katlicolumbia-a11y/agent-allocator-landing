stages:
  - test
  - deploy

copyright_guard:
  stage: test
  image: python:3.12-alpine
  script:
    - python3 scripts/verify_copyright.py

pages:
  stage: deploy
  needs:
    - copyright_guard
  script:
    - mkdir -p public
    - cp index.html public/
    - cp -r css js public/
  artifacts:
    paths:
      - public
